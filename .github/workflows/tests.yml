name: Tests

# v72：原 build.yml 是「打包 Windows exe + 发 Release」，已随 exe/安装包分发一起取消
# （项目改为 zip 分发，见 tools/make_zip.py）。
# 这里保留 CI 的价值：每次推送/PR 跑一遍语法检查 + 全部单元测试 + 状态文档一致性门禁，
# 防止回归。**开发阶段不在 CI 里做打包**（用户 2026-09-18：还在开发优化阶段，例行流程
# 不需要走到自动打包）；需要分发时本地按需执行 `python tools/make_zip.py`。
# 手动触发：Actions → Tests → Run workflow

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    # v73 修复：Windows runner 默认 stdout 是 cp1252，含中文的 print 会 UnicodeEncodeError
    # （tools/make_zip.py 里已做 reconfigure 自保，这里再兜一层，覆盖所有步骤）
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check (py_compile)
        shell: pwsh
        run: |
          python -m py_compile `
            collector\main.py collector\web.py collector\adb.py `
            collector\pidresolver.py collector\probe.py collector\apk_label.py `
            collector\logcat.py collector\export_report.py collector\dashboard.py `
            collector\data_health.py collector\sampling.py collector\target_context.py `
            collector\target_monitor.py `
            collector\jsonl_writer.py collector\runtime_health.py `
            collector\capture_session.py collector\console_output.py `
            collector\event_sink.py `
            tools\check_consistency.py tools\browser_smoke_server.py `
            collector\metrics\fps.py collector\metrics\cpu.py `
            collector\metrics\mem.py collector\metrics\network.py `
            collector\metrics\thermal.py

      - name: Python unit tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Project metadata consistency
        shell: pwsh
        run: python tools/check_consistency.py

      - uses: oven-sh/setup-bun@v2

      - name: JS assertions (web/assets/app.js pure functions)
        shell: pwsh
        run: bun run tests/test_nearest_cat.js
